[project]
name = "nanotherm"
version = "0.1.0"
description = "Um projeto feito pela Metala Nanofluidos para Ablação por radiofrequência (ARF)."
authors = [
    {name = "VCOliver",email = "victorcruz.01@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.3.0,<3.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.6.1"
pandas = "^2.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
